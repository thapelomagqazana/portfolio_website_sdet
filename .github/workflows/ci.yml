# CI — Thapelo Magqazana Engineering Portfolio
#
# Runs on every push to main and every pull request.
#
# Jobs (in dependency order):
#   1. quality   — lint, typecheck, format, unit tests, build
#   2. e2e       — Playwright across browsers and viewports
#
# A failure in any required job blocks merge (configure branch
# protection on main to require all three).
#
# Netlify deploys independently from main; if you want strict
# "no deploy without green CI" enforcement, use a build hook
# (see docs/deploy.md) — otherwise rely on branch protection.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit
# arrives. Saves CI minutes and prevents stale runs from
# reporting failures.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to read-only — jobs that
# need more must opt in explicitly.
permissions:
  contents: read

jobs:
  # =========================================================
  # 1. Quality — fast feedback (lint, types, format, unit, build)
  # =========================================================
  quality:
    name: Quality · Lint · Types · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Husky hooks must not run in CI
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Audit dependencies
        # Fails on high or critical vulnerabilities in the
        # dependency tree. See P21-01.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Verify CV PDF is a real PDF
        # Catches the failure mode where the placeholder HTML
        # was committed as .pdf. See P15-01.
        run: |
          set -e
          PDF=public/thapelo-magqazana-cv.pdf
          if [ ! -f "$PDF" ]; then
            echo "::error::$PDF is missing"
            exit 1
          fi
          if ! file "$PDF" | grep -q 'PDF document'; then
            echo "::error::$PDF is not a real PDF"
            file "$PDF"
            exit 1
          fi
          echo "CV PDF is valid."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # =========================================================
  # 2. E2E — Playwright across browsers and viewports
  # =========================================================
  e2e:
    name: E2E · Playwright
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7

  # =========================================================
  # 4. Summary gate — single required check for branch protection
  # =========================================================
  ci-success:
    name: CI success
    if: ${{ always() }}
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::quality job failed"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::e2e job failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::security job failed"
            exit 1
          fi
          echo "All required jobs passed."