    <!--
      P5-03 — Theme initialization.
      Runs synchronously before first paint so the correct
      data-theme is set before any CSS is applied.
      Prevents flash-of-wrong-theme (FOUC).

      Reads the visitor's preference from localStorage,
      falls back to system preference. Must stay small and
      dependency-free.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var resolved =
            mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.dataset.themeMode = mode;
        } catch (e) {
          // localStorage can throw in private mode or with strict
          // privacy settings. Fall back to system preference.
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          document.documentElement.setAttribute(
            'data-theme',
            prefersDark ? 'dark' : 'light',
          );
        }
      })();
    </script>
